[package]
name = "lumaviz"
version = "0.1.0"
description = "Standalone production lighting visualizer for LumaRig"
authors = ["EC Creative Studios"]
edition = "2021"

[lib]
name = "lumaviz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
